name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # The action has no dependencies and no build step, so the whole of CI
      # is: does it parse on the runtime the manifest declares, and does the
      # manifest still point at the file.
      - run: node --check index.js
      - run: |
          test "$(yq '.runs.main' action.yml)" = index.js
          test "$(yq '.runs.using' action.yml)" = node20

      # A run with no key must fail, and say why. It is the cheapest possible
      # guard against the action silently passing when it did nothing.
      - run: |
          if node index.js; then
            echo "the action exited 0 with no api-key" >&2
            exit 1
          fi

  # Running the file proves it parses. This proves it works as an action:
  # the manifest resolves, the runner marshals INPUT_API-KEY and friends with
  # their dashes intact, node20 runs it, and the outputs file comes back
  # readable. A rejected key is enough for all of that - no secret needed, so
  # it runs on a fork's pull request too.
  acts-like-an-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: render
        uses: ./
        with:
          api-key: not-a-real-key
          urls: https://example.com/
          output-dir: ci-check
          file-name: probe
          fail-on-error: false
          summary: false
      - name: the step reported nothing rendered, rather than nothing at all
        run: |
          test "${{ steps.render.outputs.count }}" = "0"
          test "${{ steps.render.outputs.credits }}" = "0"
          test "${{ steps.render.outputs.files }}" = "[]"
